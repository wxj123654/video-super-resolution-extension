<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Video GPU Super Resolution</title>
    <link rel="stylesheet" href="styles/popup.css">
  </head>
  <body>
    <main class="panel">
      <header class="header">
        <div>
          <h1>视频超分</h1>
          <p id="status">等待连接当前标签页</p>
        </div>
        <label class="switch" title="启用或关闭当前页面的视频增强">
          <input id="enabled" type="checkbox">
          <span></span>
        </label>
      </header>

      <section class="controls">
        <label>
          <span>引擎</span>
          <select id="engine">
            <option value="webgpu">WebGPU 超分</option>
            <option value="tiny-cnn">轻量模型(WebGL)</option>
            <option value="ecbsr">ECBSR 模型(ONNX/WebGPU)</option>
          </select>
        </label>

        <label>
          <span>显示方式</span>
          <select id="displayMode">
            <option value="overlay">叠加原视频</option>
            <option value="replace">替换原视频</option>
          </select>
        </label>

        <label>
          <span>放大倍率</span>
          <select id="scale">
            <option value="1">1x</option>
            <option value="1.5">1.5x</option>
            <option value="2">2x</option>
          </select>
        </label>

        <label>
          <span>锐化</span>
          <input id="sharpness" type="range" min="0" max="1.4" step="0.05">
          <output id="sharpnessValue"></output>
        </label>

        <label>
          <span>叠加强度</span>
          <input id="overlayOpacity" type="range" min="0" max="1" step="0.05">
          <output id="overlayOpacityValue"></output>
        </label>

        <label>
          <span>模式</span>
          <select id="mode">
            <option value="balanced">平衡</option>
            <option value="quality">质量优先</option>
            <option value="performance">性能优先</option>
          </select>
        </label>
      </section>

      <footer>
        <button id="rescan" type="button">重新扫描视频</button>
      </footer>

      <section class="diagnostics">
        <div class="diagnostics-header">
          <h2>WebGPU 自检</h2>
          <button id="runDiagnostics" type="button">立即检测</button>
        </div>
        <pre id="diagnosticsOutput" class="diagnostics-output">尚未检测</pre>
      </section>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
